  <g transform="translate(950, 150)">
    <circle cx="80" cy="80" r="100" fill="#45C27E" opacity="0.08"/>
    <circle cx="80" cy="80" r="65" fill="#45C27E" opacity="0.12"/>
    <text x="80" y="105" text-anchor="middle" font-size="80">🛡️</text>
