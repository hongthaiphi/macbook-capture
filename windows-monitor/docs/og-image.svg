  <rect x="280" y="330" width="170" height="44" rx="22" fill="#1E4D33" stroke="#45C27E" stroke-width="1"/>
  <text x="310" y="357" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#FFFFFF">🚫 Chặn web xấu</text>

  <rect x="470" y="330" width="170" height="44" rx="22" fill="#1E4D33" stroke="#45C27E" stroke-width="1"/>
  <text x="500" y="357" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#FFFFFF">📸 Chụp màn hình</text>

  <rect x="660" y="330" width="190" height="44" rx="22" fill="#1E4D33" stroke="#45C27E" stroke-width="1"/>
  <text x="690" y="357" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#FFFFFF">⏰ Giới hạn game</text>

  <!-- Brain science note -->
  <rect x="80" y="420" width="500" height="50" rx="10" fill="#162A1F"/>
