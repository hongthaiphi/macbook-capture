<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OG Image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(135deg, #0F2A1B 0%, #1A3D2A 100%);
    color: #fff;
    position: relative;
  }

  .bar { position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #45C27E; }

  .content {
    padding: 100px 80px 60px;
    position: relative;
    z-index: 1;
  }

  .badge {
    display: inline-block;
    background: rgba(69, 194, 126, 0.15);
    color: #45C27E;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 100px;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .sub {
    font-size: 24px;
    color: #A3C4B0;
    margin-bottom: 40px;
    font-weight: 400;
  }

  .pills {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
  }

  .pill {
    background: rgba(30, 77, 51, 0.8);
    border: 1px solid rgba(69, 194, 126, 0.3);
    border-radius: 100px;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brain-note {
    background: rgba(22, 42, 31, 0.8);
    border-radius: 12px;
    padding: 14px 22px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    color: #7BC49A;
    margin-bottom: 40px;
  }

  .contact {
    font-size: 15px;
    color: #7A9A88;
    position: absolute;
    bottom: 50px;
    left: 80px;
  }

  .shield {
    position: absolute;
    right: 60px;
    top: 120px;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .shield-circle {
    position: absolute;
    border-radius: 50%;
  }

  .shield-c1 {
    width: 240px; height: 240px;
    background: rgba(69, 194, 126, 0.06);
  }

  .shield-c2 {
    width: 170px; height: 170px;
    background: rgba(69, 194, 126, 0.1);
  }

  .shield-emoji {
    font-size: 90px;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="content">
    <div class="badge">Parental Control</div>
    <h1>Windows Monitor</h1>
    <div class="sub">Bảo vệ con trên Internet — Điều khiển từ xa qua Telegram</div>
    <div class="pills">
      <div class="pill">📊 Theo dõi thời gian</div>
      <div class="pill">🚫 Chặn web xấu</div>
      <div class="pill">📸 Chụp màn hình</div>
      <div class="pill">⏰ Giới hạn game</div>
    </div>
    <div class="brain-note">🧠 Dựa trên khoa học não bộ — Miễn phí, mã nguồn mở</div>
  </div>
  <div class="contact">💬 Zalo: 0987024488 · ✈️ Telegram: @Thaiph</div>
  <div class="shield">
    <div class="shield-circle shield-c1"></div>
    <div class="shield-circle shield-c2"></div>
    <div class="shield-emoji">🛡️</div>
  </div>
</body>
</html>
